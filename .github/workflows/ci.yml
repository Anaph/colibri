name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  engine:
    name: Engine (Linux, CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache gtest (FetchContent)
        uses: actions/cache@v4
        with:
          path: c/tests/build/_deps
          key: gtest-v1.14.0
      - name: Build engines
        run: cd c && make all
      - name: Test suite (gtest via CMake + ctest)
        run: cd c && make test
      - name: Test suite (native march)
        run: cd c && make test-native
